<p class="eyebrow" id="eyebrow">GRADE</p><h1 id="title">Model Papers</h1><p class="lead" id="lead">Subject-wise model papers and assessment frameworks.</p>

</div></main>

<script>
const data={
9:[
['Biology','biology','Biology_SSC_I_model_paper_50_percent.pdf'],['Chemistry','chemistry','Chemistry_SSC_I_model_paper_50_percent.pdf'],['Computer Science','computer-science','Computer_SSC_I_model_paper_50_percent.pdf'],['Tarjuma Quran','tarjuma-quran','Final Assessment Framework Tarjuma Quran + Model Question Paper SSC-I.pdf'],['Mathematics','mathematics','Maths_SSC_I_model_paper_50_percent.pdf'],['Physics','physics','Physics_SSC_I_model_paper_50_percent.pdf'],['English','english','Final Assessment Framework + Model Question Paper English SSC-I.pdf'],['Urdu','urdu','Final_Assessment_Framework_Model_Question_Paper_Urdu_SSC-I.pdf']],
10:[
['Biology','biology','Model_Question_Paper_Biology SSC-II.pdf'],['Chemistry','chemistry','Model_Question_Paper_Chemistry_SSC_II_2024.pdf'],['Computer Science','computer-science','Model_Question_Paper_Computer_Science_SSC_II_2024.pdf'],['Tarjuma Quran','tarjuma-quran','MODEL_PAPER_TARJUM_QURAN_10.pdf'],['Mathematics','mathematics','Final Assessment Framework + Model Question Paper Mathematics SSC-II.pdf'],['Physics','physics','Final Assessment Framework + Model Question Paper Physics SSC-II.pdf'],['English','english','Final Assessment Framework + Model Question Paper English SSC-II_compressed.pdf']],
11:[],12:[]};
const params=new URLSearchParams(location.search); const grade=Number(params.get('grade')); const list=data[grade]||[];
const names={9:'Grade 9 · SSC-I',10:'Grade 10 · SSC-II',11:'1st Year · HSSC-I',12:'2nd Year · HSSC-II'};
document.title=names[grade]+' Model Papers | Federal Board Guide';
document.getElementById('eyebrow').textContent=names[grade]||'MODEL PAPERS';
document.getElementById('title').textContent=(names[grade]||'Model Papers')+' Model Papers';
document.getElementById('lead').textContent=list.length?'All available subject-wise Assessment Framework and Model Question Paper PDFs are shown below.':'Papers for this class will appear here when they are added.';
const cards=document.getElementById('cards');
list.forEach((x,i)=>{const a=document.createElement('article');a.className='subject-card';const path='pdfs/'+encodeURIComponent(x[2]);a.innerHTML='<div class="subject-icon">📘</div><h3>'+x[0]+'</h3><p>'+names[grade]+' · Assessment Framework + Model Question Paper</p><div class="actions"><a class="btn" href="subject.html?grade='+grade+'&subject='+x[1]+'">Open</a><a class="btn btn-outline" href="'+path+'" target="_blank">PDF</a></div>';cards.appendChild(a);});
if(!list.length) document.getElementById('empty').style.display='block';
</script></body></html>
